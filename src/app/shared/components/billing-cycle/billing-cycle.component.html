<div class="period__toggle" [class.small]="small" role="group" [attr.aria-label]="'pricing.billing.label' | t">
  <button
    type="button"
    class="period__toggle__monthly"
    [class.active]="period === 'monthly'"
    [attr.aria-pressed]="period === 'monthly'"
    (click)="changePayingPeriod('monthly')"
  >
    <span class="period__label">{{ 'pricing.billing.monthly' | t }}</span>
  </button>
  <button
    type="button"
    class="period__toggle__annually"
    [class.active]="period === 'annual'"
    [attr.aria-pressed]="period === 'annual'"
    (click)="changePayingPeriod('annual')"
  >
    <span class="period__label"
      >{{ 'pricing.billing.annual' | t }} <span>{{ 'pricing.billing.save' | t }}</span></span
    >
  </button>
</div>

<button
  type="button"
  [attr.aria-label]="!text ? title : null"
  [attr.title]="title"
  [class.onlyIcon]="!text"
  [class.sizeS]="size === 's'"
  [class.transparent]="transparent"
  [class.danger]="type === 'danger'"
  [class.success]="type === 'success'"
  [class.selected]="selected"
  [class.border]="border"
  [disabled]="disabled || waiting"
  [attr.aria-busy]="waiting"
  [class.alignLeft]="align === 'left'"
  [class.alignRight]="align === 'right'"
  [class.alignCenter]="align === 'center'"
>
  @if (icon) {
    <img [src]="icon" [width]="iconSize" alt="" />
  }
  @if (waiting) {
    <img class="waitingIcon" src="/assets/icons/loading.svg" alt="" />
    @if (text) {
      <span class="visuallyHidden">{{ text }}</span>
    }
  } @else {
    {{ text }}
  }
</button>

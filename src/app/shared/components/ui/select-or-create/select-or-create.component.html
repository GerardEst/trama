<div class="dropdown" role="dialog" [attr.aria-label]="'common.select.label' | t">
  <div class="dropdown__header">
    <label for="option-search">{{ 'common.select.find' | t }}</label>
    @if (message) {
      <p id="option-search-help">{{ message }}</p>
    }
  </div>

  <input
    #search
    id="option-search"
    class="dropdown__search"
    type="search"
    autocomplete="off"
    aria-describedby="option-search-help"
    (input)="filterOptions($event)"
    (keydown.enter)="submitSearch()"
    [placeholder]="'common.select.placeholder' | t"
  />

  @if (newOption) {
    <button
      class="dropdown__create"
      type="button"
      (click)="createOption(newOption)"
    >
      <img src="/assets/icons/plus.svg" alt="" />
      <span>{{ 'common.select.create' | t }} <strong>“{{ newOption }}”</strong></span>
    </button>
  }

  <div class="dropdown__options" role="listbox" [attr.aria-label]="'common.select.available' | t">
    @for (option of searchedOptions; track option.id) {
      <button
        class="dropdown__option"
        type="button"
        role="option"
        [attr.aria-selected]="option.id === selectedOption"
        (click)="selectOption(option)"
      >
        <span>{{ option.name }}</span>
        @if (option.id === selectedOption) {
          <img src="/assets/icons/tick.svg" alt="" />
        }
      </button>
    } @empty {
      @if (!newOption) {
        <p class="dropdown__empty">{{ 'common.select.empty' | t }}</p>
      }
    }
  </div>
</div>

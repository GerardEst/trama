<div class="formField">
  <div class="formField__header">
    @if (controlId) {
      <label class="formField__label" [for]="controlId">{{ label }}</label>
    } @else {
      <p class="formField__label">{{ label }}</p>
    }

    @if (required) {
      <span class="formField__requirement">{{ 'common.required' | t }}</span>
    } @else if (showOptional) {
      <span class="formField__requirement">{{ 'common.optional' | t }}</span>
    }
  </div>

  <div class="formField__control">
    <ng-content></ng-content>
  </div>

  @if (description) {
    <p class="formField__description" [id]="descriptionId">
      {{ description }}
    </p>
  }
</div>

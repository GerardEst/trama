<div
  #board
  class="board"
  [class.isJoining]="isDrawingJoin"
  [class.board--grid]="grid"
  (pointerdown)="checkDragStart($event)"
  (pointermove)="checkDrag($event)"
  (pointerup)="checkDragStop($event)"
  (pointercancel)="cancelJoin($event)"
  (click)="closeContextMenu()"
>
  <div
    class="contextMenu"
    [class.active]="contextMenuActive"
    [style.left.px]="contextMenuPosition.x"
    [style.top.px]="contextMenuPosition.y"
  >
    <header>
      <p>Create new node</p>
    </header>
    <li (click)="addNode($event, 'text')">Free text node</li>
    <li (click)="addNode($event, 'content')">Answers node</li>
    <li (click)="addNode($event, 'distributor')">Distributor node</li>
    <li (click)="addNode($event, 'end')">End node</li>
  </div>

  <polo-board-flows [drawingStroke]="joinStroke"></polo-board-flows>
  @if (selectionBox) {
    <div
      class="selectionBox"
      [style.left.px]="selectionBox.left"
      [style.top.px]="selectionBox.top"
      [style.width.px]="selectionBox.width"
      [style.height.px]="selectionBox.height"
    ></div>
  }
  @if (activeStory.entireTree()) {
    <ng-container>
      @for (node of activeStory.entireTree().nodes; track node.id) {
        <polo-node
          #node
          cdkDrag
          [cdkDragData]="node.id"
          [class.node--selected]="selectedNodeIds.has(node.id)"
          [cdkDragConstrainPosition]="constrainNodePosition"
          [cdkDragFreeDragPosition]="getNodeDragPosition(node)"
          [nodeId]="node.id"
          [type]="node.type || 'content'"
          (click)="setActiveNode(node.id, activeStory.storyId())"
          (pointerdown)="nodePointerDown(node.id)"
          (mouseenter)="focusNode($event)"
          (mouseleave)="blurNode($event)"
          (duplicateNode)="duplicateNode($event)"
          (removeNode)="removeNode($event)"
          (cdkDragStarted)="nodeDragStarted($event)"
          (cdkDragEnded)="nodeDragEnded($event, node)"
          (cdkDragMoved)="nodeDragCheck($event)"
          [join]="node.join || []"
          [text]="node.text || ''"
          [events]="node.events"
          [answers]="node.answers"
          [userTextOptions]="node.userTextOptions"
          [conditions]="node.conditions"
          [fallbackCondition]="node.fallbackCondition"
          [shareOptions]="node.share || {}"
          [image]="node.image?.path"
          [links]="node.links || []"
        >
          <div class="dragHandle">
            <p>
              <span style="text-transform: capitalize">{{ node.type || 'content' }}</span>
              node
            </p>
          </div>
        </polo-node>
      }
    </ng-container>
  }
</div>

<div class="richTextField">
  <div #preview class="richTextField__preview" [attr.tabindex]="inlineEditor ? -1 : 0"
    [attr.role]="inlineEditor ? null : 'textbox'" [attr.aria-label]="label()"
    [attr.aria-multiline]="inlineEditor ? null : true"
    [attr.aria-placeholder]="inlineEditor ? null : placeholder()" [attr.data-placeholder]="placeholder()"
    [attr.aria-busy]="loadingEditor || null" [class.richTextField__preview--loading]="loadingEditor"
    (pointerdown)="prepareInlineEdit()" (focusin)="startInlineEdit()" (keydown)="onKeydown($event)"
    [innerHTML]="currentHtml"></div>
  <polo-basic-button class="richTextField__button" size="s" [transparent]="true"
    [title]="'Focus on ' + label() + ' (Ctrl+F / ⌘F)'"
    icon="/assets/icons/maximize.svg" (pointerdown)="$event.stopPropagation()"
    (click)="open()" />
  @if (openEditor) {
    @defer (on immediate) {
      <polo-rich-text-editor [label]="label()" [text]="draft" [placeholder]="placeholder()"
        [inlineOnly]="inlineOnly()" (closed)="onClosed($event)" />
    } @placeholder { <span>Loading editor…</span> }
  }
</div>

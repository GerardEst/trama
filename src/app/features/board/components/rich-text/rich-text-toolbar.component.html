<div class="richTextEditor__toolbar" [class.richTextEditor__toolbar--embedded]="embedded()" role="toolbar"
  [attr.aria-label]="'board.editor.formatting' | t">
  <button type="button" [disabled]="unavailable()" [attr.aria-label]="'board.editor.bold' | t" (click)="target()?.toggle('bold')"><strong>B</strong></button>
  <button type="button" [disabled]="unavailable()" [attr.aria-label]="'board.editor.italic' | t" (click)="target()?.toggle('italic')"><em>I</em></button>
  @if (showBlockTools() || !target()?.inlineOnly()) {
    <button type="button" [disabled]="blockUnavailable()" [attr.aria-label]="'board.editor.paragraph' | t" (click)="target()?.paragraph()">P</button>
    <button type="button" [disabled]="blockUnavailable()" [attr.aria-label]="'board.editor.heading1' | t" (click)="target()?.heading(1)">H1</button>
    <button type="button" [disabled]="blockUnavailable()" [attr.aria-label]="'board.editor.heading2' | t" (click)="target()?.heading(2)">H2</button>
    <button type="button" [disabled]="blockUnavailable()" [attr.aria-label]="'board.editor.heading3' | t" (click)="target()?.heading(3)">H3</button>
    <button type="button" [disabled]="blockUnavailable()" [attr.aria-label]="'board.editor.bulletList' | t" (click)="target()?.toggle('bulletList')">{{ 'board.editor.bulletListShort' | t }}</button>
    <button type="button" [disabled]="blockUnavailable()" [attr.aria-label]="'board.editor.numberedList' | t" (click)="target()?.toggle('orderedList')">{{ 'board.editor.numberedListShort' | t }}</button>
  }
  <select #variableSelect [disabled]="unavailable()" [attr.aria-label]="'board.editor.insertVariable' | t"
    (change)="target()?.insertVariable(variableSelect.value, variableSelect)">
    <option value="">{{ 'board.editor.insertVariableOption' | t }}</option>
    @for (variable of target()?.variables(); track variable.kind + ':' + variable.key) {
      <option [value]="variable.kind + ':' + variable.key">{{ variable.label }}</option>
    }
  </select>
  @if ((showBlockTools() || !target()?.inlineOnly()) && target()?.categories()?.length) {
    <select #categorySelect [disabled]="blockUnavailable()" [attr.aria-label]="'board.editor.insertCategory' | t"
      (change)="target()?.insertCategory(categorySelect.value, categorySelect)">
      <option value="">{{ 'board.editor.insertCategoryOption' | t }}</option>
      @for (category of target()?.categories(); track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  }
</div>

<dialog #dialog class="focusEditor richTextEditor" [attr.aria-label]="'board.editor.focusOn' | t: { label: label() }"
  (close)="onClosed()" (pointerdown)="onBackdropPointerDown($event)">
  <header class="focusEditor__header">
    <button type="button" [attr.aria-label]="'board.editor.closeFocus' | t" (click)="close()">
      {{ 'board.editor.close' | t }}
    </button>
  </header>
  <main class="focusEditor__body">
    <div class="richTextEditor__toolbar" role="toolbar" [attr.aria-label]="'board.editor.formatting' | t">
      <button type="button" [attr.aria-label]="'board.editor.bold' | t" (click)="toggle('bold')"><strong>B</strong></button>
      <button type="button" [attr.aria-label]="'board.editor.italic' | t" (click)="toggle('italic')"><em>I</em></button>
      @if (!inlineOnly()) {
        <button type="button" [attr.aria-label]="'board.editor.paragraph' | t" (click)="paragraph()">P</button>
        <button type="button" [attr.aria-label]="'board.editor.heading1' | t" (click)="heading(1)">H1</button>
        <button type="button" [attr.aria-label]="'board.editor.heading2' | t" (click)="heading(2)">H2</button>
        <button type="button" [attr.aria-label]="'board.editor.heading3' | t" (click)="heading(3)">H3</button>
        <button type="button" [attr.aria-label]="'board.editor.bulletList' | t" (click)="toggle('bulletList')">
          {{ 'board.editor.bulletListShort' | t }}
        </button>
        <button type="button" [attr.aria-label]="'board.editor.numberedList' | t" (click)="toggle('orderedList')">
          {{ 'board.editor.numberedListShort' | t }}
        </button>
      }
      <select #variableSelect [attr.aria-label]="'board.editor.insertVariable' | t" (change)="insertVariable(variableSelect.value, variableSelect)">
        <option value="">{{ 'board.editor.insertVariableOption' | t }}</option>
        @for (variable of variables(); track variable.kind + ':' + variable.key) {
          <option [value]="variable.kind + ':' + variable.key">{{ variable.label }}</option>
        }
      </select>
      @if (!inlineOnly() && categories().length) {
        <select #categorySelect [attr.aria-label]="'board.editor.insertCategory' | t" (change)="insertCategory(categorySelect.value, categorySelect)">
          <option value="">{{ 'board.editor.insertCategoryOption' | t }}</option>
          @for (category of categories(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      }
    </div>
    <div #surface class="richTextEditor__surface"></div>
  </main>
</dialog>

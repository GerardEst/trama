<section
  class="addEvent"
  role="dialog"
  aria-modal="false"
  aria-labelledby="event-dialog-title"
  aria-describedby="event-dialog-description"
>
  <header class="addEvent__header">
    <div>
      <p class="addEvent__eyebrow">{{ 'board.event.eyebrow' | t }}</p>
      <h2 id="event-dialog-title">
        {{ (canBeDeleted ? 'board.event.edit' : 'board.event.add') | t }}
      </h2>
      <p id="event-dialog-description" class="addEvent__description">
        {{ 'board.event.description' | t }}
      </p>
    </div>
    <button
      class="addEvent__close"
      type="button"
      [attr.aria-label]="'board.event.close' | t"
      [title]="'common.close' | t"
      (click)="onCancel()"
    >
      <img src="/assets/icons/close.svg" alt="" />
    </button>
  </header>

  <div class="addEvent__body">
    <div class="addEvent__type" role="group" [attr.aria-label]="'board.event.typeLabel' | t">
      <p class="addEvent__label">
        {{ 'board.event.question' | t }}
        <polo-context-help topic="board.events"></polo-context-help>
      </p>
      <div class="addEvent__typeOptions">
        <polo-choice-card
          #typeOption
          icon="/assets/icons/stat.svg"
          [label]="'board.event.stat' | t"
          [description]="'board.event.statHelp' | t"
          [selected]="type === 'stat'"
          (chosen)="selectType('stat')"
        ></polo-choice-card>
        <polo-choice-card
          #typeOption
          icon="/assets/icons/condition.svg"
          [label]="'board.event.condition' | t"
          [description]="'board.event.conditionHelp' | t"
          [selected]="type === 'condition'"
          (chosen)="selectType('condition')"
        ></polo-choice-card>
        <polo-choice-card
          #typeOption
          icon="/assets/icons/tag.svg"
          [label]="'board.event.property' | t"
          [description]="'board.event.propertyHelp' | t"
          [selected]="type === 'property'"
          (chosen)="selectType('property')"
        ></polo-choice-card>
      </div>
    </div>

    <div class="addEvent__content">
      <polo-node-add-modify-ref
        [type]="type"
        [selectedOption]="target"
        [amount]="amount"
        [property]="property"
        (onChangeTarget)="onChangeTarget($event)"
        (onChangeAmount)="onChangeAmount($event)"
        (onChangeProperty)="onChangeProperty($event)"
      ></polo-node-add-modify-ref>
    </div>
  </div>

  <footer class="addEvent__actions">
    @if (confirmingDelete) {
      <p class="addEvent__deletePrompt" aria-live="polite">
        {{ 'board.event.deletePrompt' | t }}
      </p>
      <button
        class="addEvent__button addEvent__button--secondary"
        type="button"
        (click)="confirmingDelete = false"
      >
        {{ 'board.event.keep' | t }}
      </button>
      <button
        class="addEvent__button addEvent__button--confirmDelete"
        type="button"
        (click)="deleteEvent()"
      >
        {{ 'common.delete' | t }}
      </button>
    } @else {
      @if (canBeDeleted) {
        <button
          class="addEvent__button addEvent__button--delete"
          type="button"
          (click)="requestDelete()"
        >
          <img src="/assets/icons/trash.svg" alt="" />
          {{ 'common.delete' | t }}
        </button>
      }
      <span class="addEvent__actionsSpacer"></span>
      <button
        class="addEvent__button addEvent__button--secondary"
        type="button"
        (click)="onCancel()"
      >
        {{ 'common.cancel' | t }}
      </button>
      <button
        class="addEvent__button addEvent__button--primary"
        type="button"
        [disabled]="!canSave"
        [attr.title]="canSave ? null : ('board.event.incomplete' | t)"
        (click)="saveEvent()"
      >
        {{ (canBeDeleted ? 'board.event.save' : 'board.event.add') | t }}
      </button>
    }
  </footer>
</section>

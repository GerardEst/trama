<section
  class="addEvent"
  role="dialog"
  aria-modal="false"
  aria-labelledby="event-dialog-title"
  aria-describedby="event-dialog-description"
>
  <header class="addEvent__header">
    <div>
      <p class="addEvent__eyebrow">Player state</p>
      <h2 id="event-dialog-title">
        {{ canBeDeleted ? 'Edit event' : 'Add event' }}
      </h2>
      <p id="event-dialog-description" class="addEvent__description">
        Update the player when this part of the story is reached.
      </p>
    </div>
    <button
      class="addEvent__close"
      type="button"
      aria-label="Close event editor"
      title="Close"
      (click)="onCancel()"
    >
      <img src="/assets/icons/close.svg" alt="" />
    </button>
  </header>

  <div class="addEvent__body">
    <div class="addEvent__type" role="group" aria-label="Event type">
      <p class="addEvent__label">What should change?</p>
      <div class="addEvent__typeOptions">
        <polo-choice-card
          #typeOption
          icon="/assets/icons/stat.svg"
          label="Stat"
          description="Adjust a number"
          [selected]="type === 'stat'"
          (chosen)="selectType('stat')"
        ></polo-choice-card>
        <polo-choice-card
          #typeOption
          icon="/assets/icons/condition.svg"
          label="Condition"
          description="Grant or remove"
          [selected]="type === 'condition'"
          (chosen)="selectType('condition')"
        ></polo-choice-card>
        <polo-choice-card
          #typeOption
          icon="/assets/icons/tag.svg"
          label="Property"
          description="Set a text value"
          [selected]="type === 'property'"
          (chosen)="selectType('property')"
        ></polo-choice-card>
      </div>
    </div>

    <div class="addEvent__content">
      <polo-node-add-modify-ref
        [type]="type"
        [selectedOption]="target"
        [amount]="amount"
        [property]="property"
        (onChangeTarget)="onChangeTarget($event)"
        (onChangeAmount)="onChangeAmount($event)"
        (onChangeProperty)="onChangeProperty($event)"
      ></polo-node-add-modify-ref>
    </div>
  </div>

  <footer class="addEvent__actions">
    @if (confirmingDelete) {
      <p class="addEvent__deletePrompt" aria-live="polite">
        Delete this event?
      </p>
      <button
        class="addEvent__button addEvent__button--secondary"
        type="button"
        (click)="confirmingDelete = false"
      >
        Keep event
      </button>
      <button
        class="addEvent__button addEvent__button--confirmDelete"
        type="button"
        (click)="deleteEvent()"
      >
        Delete
      </button>
    } @else {
      @if (canBeDeleted) {
        <button
          class="addEvent__button addEvent__button--delete"
          type="button"
          (click)="requestDelete()"
        >
          <img src="/assets/icons/trash.svg" alt="" />
          Delete
        </button>
      }
      <span class="addEvent__actionsSpacer"></span>
      <button
        class="addEvent__button addEvent__button--secondary"
        type="button"
        (click)="onCancel()"
      >
        Cancel
      </button>
      <button
        class="addEvent__button addEvent__button--primary"
        type="button"
        [disabled]="!canSave"
        [attr.title]="canSave ? null : 'Choose a target and complete the event details'"
        (click)="saveEvent()"
      >
        {{ canBeDeleted ? 'Save changes' : 'Add event' }}
      </button>
    }
  </footer>
</section>

<div class="eventDetail">
  <polo-form-field
    #targetField
    [label]="typeLabel"
    [controlId]="controlIdPrefix + '-target'"
    [required]="true"
    [description]="referenceHelp"
  >
    <polo-selector
      [controlId]="controlIdPrefix + '-target'"
      [describedBy]="targetField.descriptionId"
      [required]="true"
      [options]="options"
      [message]="message"
      [selected]="selectedOption"
      [placeholder]="message"
      (optionCreated)="onNewOption($event)"
      (selectionChanged)="onSelectOption($event)"
    ></polo-selector>
  </polo-form-field>

  @if (type === 'stat') {
    <polo-form-field
      #amountField
      [label]="(mode === 'requirement' ? 'board.reference.minimum' : 'board.reference.changeBy') | t"
      [controlId]="controlIdPrefix + '-amount'"
      [required]="true"
      [description]="
        (mode === 'requirement' ? 'board.reference.minimumHelp' : 'board.reference.changeHelp') | t
      "
    >
      <input
        class="eventDetail__input"
        [id]="controlIdPrefix + '-amount'"
        [attr.aria-describedby]="amountField.descriptionId"
        type="number"
        inputmode="numeric"
        required
        [placeholder]="
          (mode === 'requirement' ? 'board.reference.minimumExample' : 'board.reference.changeExample')
            | t
        "
        [value]="amount ?? ''"
        (input)="changeAmount($event)"
      />
    </polo-form-field>
  } @else if (type === 'condition') {
    <polo-form-field
      [label]="'board.reference.conditionState' | t"
      [required]="true"
      [showOptional]="false"
    >
      <label class="eventDetail__switchRow" [for]="controlIdPrefix + '-condition-active'">
        <span>
          <strong>{{
            (mode === 'requirement' ? 'board.reference.mustBeActive' : 'board.reference.activeAfter') | t
          }}</strong>
          <small>
            {{
              (mode === 'requirement'
                ? 'board.reference.mustBeActiveHelp'
                : 'board.reference.activeAfterHelp'
              ) | t
            }}
          </small>
        </span>
        <input
          [id]="controlIdPrefix + '-condition-active'"
          type="checkbox"
          [checked]="isConditionActive"
          (change)="changeCheckbox($event)"
        />
      </label>
    </polo-form-field>
  } @else {
    <polo-form-field
      #propertyField
      [label]="'board.reference.newValue' | t"
      [controlId]="controlIdPrefix + '-property'"
      [description]="'board.reference.newValueHelp' | t"
    >
      <input
        class="eventDetail__input"
        [id]="controlIdPrefix + '-property'"
        [attr.aria-describedby]="propertyField.descriptionId"
        type="text"
        [placeholder]="'board.reference.enterValue' | t"
        [value]="property ?? ''"
        (input)="changeProperty($event)"
      />
    </polo-form-field>
  }

  @if (selectedOption) {
    <div class="eventDetail__summary" aria-live="polite">
      <span aria-hidden="true">→</span>
      <p>{{ eventSummary }}</p>
    </div>
  }
</div>

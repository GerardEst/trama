<div class="eventDetail">
  <polo-form-field
    #targetField
    [label]="typeLabel"
    [controlId]="controlIdPrefix + '-target'"
    [required]="true"
    [description]="'Select an existing ' + type + ' or create one without leaving this ' + mode + '.'"
  >
    <polo-selector
      [controlId]="controlIdPrefix + '-target'"
      [describedBy]="targetField.descriptionId"
      [required]="true"
      [options]="options"
      [message]="message"
      [selected]="selectedOption"
      [placeholder]="'Choose or create a ' + type"
      (optionCreated)="onNewOption($event)"
      (selectionChanged)="onSelectOption($event)"
    ></polo-selector>
  </polo-form-field>

  @if (type === 'stat') {
    <polo-form-field
      #amountField
      [label]="mode === 'requirement' ? 'Minimum value' : 'Change by'"
      [controlId]="controlIdPrefix + '-amount'"
      [required]="true"
      [description]="mode === 'requirement'
        ? 'The answer is available when the player has at least this value.'
        : 'Use a positive number to increase it, or a negative one to decrease it.'"
    >
      <input
        class="eventDetail__input"
        [id]="controlIdPrefix + '-amount'"
        [attr.aria-describedby]="amountField.descriptionId"
        type="number"
        inputmode="numeric"
        required
        [placeholder]="mode === 'requirement' ? 'e.g. 5' : 'e.g. 5 or -2'"
        [value]="amount ?? ''"
        (input)="changeAmount($event)"
      />
    </polo-form-field>
  } @else if (type === 'condition') {
    <polo-form-field
      label="Condition state"
      [required]="true"
      [showOptional]="false"
    >
      <label class="eventDetail__switchRow" [for]="controlIdPrefix + '-condition-active'">
        <span>
          <strong>{{ mode === 'requirement' ? 'Must be active' : 'Active after this event' }}</strong>
          <small>
            {{ mode === 'requirement'
              ? 'Turn this off to require the condition to be inactive.'
              : 'Turn this off to remove the condition.' }}
          </small>
        </span>
        <input
          [id]="controlIdPrefix + '-condition-active'"
          type="checkbox"
          [checked]="isConditionActive"
          (change)="changeCheckbox($event)"
        />
      </label>
    </polo-form-field>
  } @else {
    <polo-form-field
      #propertyField
      label="New value"
      [controlId]="controlIdPrefix + '-property'"
      description="This replaces the property's current value. Leave empty to clear it."
    >
      <input
        class="eventDetail__input"
        [id]="controlIdPrefix + '-property'"
        [attr.aria-describedby]="propertyField.descriptionId"
        type="text"
        placeholder="Enter a value"
        [value]="property ?? ''"
        (input)="changeProperty($event)"
      />
    </polo-form-field>
  }

  @if (selectedOption) {
    <div class="eventDetail__summary" aria-live="polite">
      <span aria-hidden="true">→</span>
      <p>{{ eventSummary }}</p>
    </div>
  }
</div>

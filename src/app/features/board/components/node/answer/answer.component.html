<div class="top-bar">
  <polo-node-requirements
    [requirements]="requirements"
    [answerId]="answerId"
  ></polo-node-requirements>
  <polo-basic-button
    class="delete-answer"
    size="s"
    title="Delete answer"
    (click)="removeAnswer()"
    icon="/assets/icons/trash.svg"
    [transparent]="true"
  ></polo-basic-button>
</div>
<polo-rich-text-field label="Answer text" [text]="text" [inlineOnly]="true"
  placeholder="Write an answer…" (saved)="saveAnswerText($event)" />
<polo-node-events [events]="events" [answerId]="answerId"></polo-node-events>
<div
  class="union_point"
  [attr.data-board-origin]="answerId"
  [poloBoardAnchor]="answerId + '_join'"
  [class.union_point--hasJoin]="hasJoin"
></div>

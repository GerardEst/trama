<div #game class="gameContainer">
  @if (session.problem() === 'missingStart') {
    <p class="gameNotice" role="status">{{ 'playground.missingStart' | t }}</p>
  }
  @if (mode === 'cumulative') {
    <polo-cumulative-game [nodes]="activeNodes" [previousNodes]="inactiveNodes"
      (answerSelected)="selectAnswer($event)" (continued)="continueFlow($event)" />
  } @else {
    <polo-single-game [nodes]="activeNodes"
      (answerSelected)="selectAnswer($event)" (continued)="continueFlow($event)" />
  }
</div>

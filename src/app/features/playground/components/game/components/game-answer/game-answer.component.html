<button type="button" [disabled]="disabled" [class.selected]="selected" (click)="chosen.emit()">
  <span [innerHTML]="text"></span>
  @if (locked) {
    <span class="answer__locked">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="10" width="16" height="11" rx="2" />
        <path d="M8 10V6a4 4 0 0 1 8 0v4" />
      </svg>
      {{ 'common.answerDisplay.unavailable' | t }}
    </span>
    @for (requirement of missingRequirements; track $index) {
      <span class="answer__requirement">{{ requirement }}</span>
    }
  }
</button>

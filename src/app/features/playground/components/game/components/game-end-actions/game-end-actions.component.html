<div class="actions">
  @for (link of links; track $index) {
    <a [href]="normalizeLink(link.url)" target="_blank" rel="noopener noreferrer">
      {{ link.name }} <span aria-hidden="true">↗</span>
    </a>
  }
  @if (sharing) {
    <button type="button" [disabled]="busy" [attr.aria-busy]="busy" (click)="shareStory()">
      {{ share?.shareButtonText || ('playground.share' | t) }}
    </button>
  }
</div>
<p class="feedback" aria-live="polite">{{ feedback ? (feedback | t) : '' }}</p>
@if (feedback === 'playground.copyManually') {
  <input type="text" inputmode="url" readonly [value]="readingUrl()" [attr.aria-label]="'playground.shareLink' | t" (focus)="selectLink($event)" />
}

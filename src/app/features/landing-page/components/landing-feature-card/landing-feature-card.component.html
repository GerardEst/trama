<article class="card">
  <div class="card__visual" aria-hidden="true">
    <ng-content></ng-content>
  </div>
  <div class="card__copy">
    @if (label) {
      <p class="card__label">{{ label }}</p>
    }
    <h3>{{ title }}</h3>
    <p class="card__description">{{ description }}</p>
  </div>
  <a class="card__link" routerLink="/docs/features" [fragment]="docsFragment"
    >{{ linkLabel }} <span aria-hidden="true">→</span></a
  >
</article>

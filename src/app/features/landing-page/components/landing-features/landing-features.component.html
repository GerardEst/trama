<section class="features" aria-labelledby="features-title">
  <div class="features__heading">
    <p class="features__eyebrow">{{ 'landing.features.eyebrow' | t }}</p>
    <h2 id="features-title">
      {{ 'landing.features.titleStart' | t }} <em>{{ 'landing.features.titleEnd' | t }}</em>
    </h2>
    <p class="features__description">{{ 'landing.features.description' | t }}</p>
  </div>
  <div class="features__grid">
    @for (feature of features; track feature.docsFragment) {
      <polo-landing-feature-card
        [title]="copyKey(feature, 'title') | t"
        [description]="copyKey(feature, 'description') | t"
        [label]="copyKey(feature, 'label') | t"
        [linkLabel]="copyKey(feature, 'link') | t"
        [docsFragment]="feature.docsFragment"
        [wide]="feature.wide"
      >
        <polo-landing-feature-visual [kind]="feature.visual"></polo-landing-feature-visual>
      </polo-landing-feature-card>
    }
  </div>
  <div class="features__footer">
    <a class="features__docs" href="/docs/features">
      {{ 'landing.footer.guide' | t }} <span aria-hidden="true">→</span>
    </a>
  </div>
</section>

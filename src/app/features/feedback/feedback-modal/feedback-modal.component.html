<polo-modal-window [name]="'dashboard.feedback.title' | t">
  <div modal-content>
    <div class="feedback-content">
      <div class="feedback-message">
        <label for="message">{{ 'dashboard.feedback.label' | t }}</label>
        <textarea 
          id="message"
          [(ngModel)]="feedbackMessage"
          [placeholder]="'dashboard.feedback.placeholder' | t"
          rows="4"
          [disabled]="isSubmitting"
        ></textarea>
      </div>
      
      @if (screenshot) {
        <div class="screenshot-preview">
          <label>{{ 'dashboard.feedback.screenshot' | t }}</label>
          <img [src]="screenshot" [alt]="'dashboard.feedback.screenshotAlt' | t" class="screenshot-image">
        </div>
      }
    </div>
  </div>
  
  <div modal-options>
    <polo-basic-button 
      [text]="'common.cancel' | t"
      (click)="cancel()"
      [transparent]="true"
      [disabled]="isSubmitting"
    ></polo-basic-button>
    
    <polo-basic-button 
      [text]="'dashboard.feedback.send' | t"
      type="success"
      (click)="submitFeedback()"
      [disabled]="!feedbackMessage.trim() || isSubmitting"
      [waiting]="isSubmitting"
    ></polo-basic-button>
  </div>
</polo-modal-window>

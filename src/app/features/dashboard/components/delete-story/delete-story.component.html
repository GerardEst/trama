<polo-alert-window>
  <ng-container modal-content>
    <p>{{ 'dashboard.delete.confirm' | t }}</p>
  </ng-container>
  <ng-container modal-options>
    <polo-basic-button (click)="close()" [text]="'common.cancel' | t"></polo-basic-button>
    <polo-basic-button (click)="confirm()" [text]="'common.delete' | t"></polo-basic-button>
  </ng-container>
</polo-alert-window>
